# Local tunnel overlay only; the host cloudflared is the public ingress.
user www;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 2G;

    # Exclude OAuth query parameters from access logs.
    log_format tunnel '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log tunnel;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Cloudflare supplies this header. The origin ports are loopback-only;
    # direct local requests without it share the Docker gateway fallback.
    map $http_cf_connecting_ip $tunnel_client {
        default $http_cf_connecting_ip;
        '' $binary_remote_addr;
    }
    map "$request_method:$uri" $auth_limit_key {
        default '';
        ~*^POST:/(api/)?auth/ $tunnel_client;
    }
    limit_req_zone $auth_limit_key zone=tunnel_auth:10m rate=6r/m;
    map $uri $meta_proof_limit_key {
        default '';
        /public/fb-webhook-proof 'escorpiano-proof';
    }
    # A global proof-only budget also bounds callers rotating source addresses.
    limit_req_zone $meta_proof_limit_key zone=meta_proof:1m rate=5r/s;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # This overlay serves the explicitly configured HTTPS tunnel domains.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    server {
        listen 5000;
        server_name _;
        limit_req zone=tunnel_auth burst=10 nodelay;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        location /api/ {
            proxy_pass http://127.0.0.1:3000/;
        }

        location /uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tif tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        location / {
            proxy_pass http://127.0.0.1:4200;
        }
    }

    server {
        listen 5001;
        server_name _;
        limit_req zone=tunnel_auth burst=10 nodelay;

        # Proof-only ingress. Docker DNS is resolved at request time so the
        # normal stack also starts when the optional capture service is absent.
        location = /public/fb-webhook-proof {
            limit_req zone=meta_proof burst=20 nodelay;
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $meta_capture_origin http://meta-proof:3033;
            proxy_pass $meta_capture_origin;
            client_max_body_size 1m;
            client_body_buffer_size 1m;
            client_body_timeout 10s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            # Verification requests contain a secret in their query string.
            access_log off;
            error_log /dev/null;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
