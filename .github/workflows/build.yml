---
name: Build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Um push novo na mesma branch cancela o build anterior (economia de minutos).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.23.4']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Processes are sequential so ts-jest/coverage caches are released between
      # batches. Both library shards plus backend cover the original root suite.
      - name: Run library tests (1/2)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          JEST_JUNIT_OUTPUT_NAME: junit-libraries-1.xml
        run: pnpm test --selectProjects nestjs-libraries --runInBand --shard=1/2 --coverageDirectory=coverage/libraries-1

      - name: Run library tests (2/2)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          JEST_JUNIT_OUTPUT_NAME: junit-libraries-2.xml
        run: pnpm test --selectProjects nestjs-libraries --runInBand --shard=2/2 --coverageDirectory=coverage/libraries-2

      - name: Run backend tests
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          JEST_JUNIT_OUTPUT_NAME: junit-backend.xml
        run: pnpm test --selectProjects backend --runInBand --coverageDirectory=coverage/backend

      # O orchestrator roda em outro processo para liberar a cobertura das
      # suites antigas antes de instrumentar o worker Temporal. Juntar os tres
      # projetos ultrapassa o heap de 6GB do runner mesmo sem falha de spec.
      - name: Run orchestrator tests
        run: pnpm test:orchestrator

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run build
